[project]
name = "tachelhit-asr"
version = "0.1.0"
description = "Open speech recognition and speech translation for Tachelhit (Tashelhit, Souss Amazigh)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Othmane Moussawi" }]
requires-python = ">=3.10"
# PyTorch is installed separately so you can pick the ROCm / CUDA / CPU build (see docs/SETUP_ROCM.md).
dependencies = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "soundfile>=0.12",
    "soxr>=0.5",
    "jiwer>=3.0",
    "sacrebleu>=2.4",
    "pyyaml>=6.0",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["gradio>=5"]
track = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tachelhit_asr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
