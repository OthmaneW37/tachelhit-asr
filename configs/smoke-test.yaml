# Tiny run to check the whole pipeline end to end (works on CPU, ~minutes).
model_name: openai/whisper-tiny
language: arabic
task: transcribe
normalizer: arabic

train_sources: [dahimi]
train_split: test      # small split, avoids downloading the full train set for a smoke test
eval_sources: [dahimi]
eval_split: test
max_train_samples: 16
max_eval_samples: 8

training:
  output_dir: outputs/smoke-test
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  learning_rate: 1.0e-5
  max_steps: 4
  eval_strategy: steps
  eval_steps: 4
  save_strategy: "no"
  logging_steps: 1
  predict_with_generate: true
  generation_max_length: 64
  report_to: none
  remove_unused_columns: false
  label_names: [labels]
